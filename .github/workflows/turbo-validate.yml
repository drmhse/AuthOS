name: Validate shared dependency store

# Proves the prime-to-build handoff the release workflow now depends on, without
# publishing anything. Mirrors one architecture and one backend of the real
# matrix, and reports what each half cost so the effect is measurable.
#
# Run it from the Actions tab when the release workflow's caching changes.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TARGET: x86_64-unknown-linux-musl
  TURBO_VERSION: 0.3.0

jobs:
  prime:
    name: Prime shared dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-zigbuild
          fallback: none

      - name: Install cargo-turbo
        run: cargo install cargo-turbo --locked --version ${{ env.TURBO_VERSION }}

      - name: Reduce the binaries to stubs
        working-directory: api
        run: |
          for stub in src/main.rs src/sso_sqlite.rs src/sso_psql.rs src/sso_mysql.rs; do
            printf 'fn main() {}\n' > "${stub}"
          done

      - name: Compile the dependency set for every backend
        working-directory: api
        run: |
          set -euo pipefail
          start=$(date +%s)
          while read -r feature binary; do
            [ -n "${feature}" ] || continue
            cargo zigbuild --release --locked \
              --target "${RUST_TARGET}" \
              --no-default-features --features "${feature}" \
              --bin "${binary}"
          done <<'BACKENDS'
          db_sqlite sso_sqlite
          db_psql sso_psql
          db_mysql sso_mysql
          BACKENDS
          echo "PRIME: dependency compile took $(( $(date +%s) - start ))s"

      - name: Hand the dependencies to the shared store
        working-directory: api
        run: cargo turbo store zigbuild --release --target "${RUST_TARGET}"

      - name: Report what was stored
        run: |
          cargo turbo status
          du -sh ~/.cache/cargo-turbo

      - name: Archive and upload the shared dependency store
        run: tar -C "${HOME}/.cache" --zstd -cf turbo-store.tar.zst cargo-turbo

      - name: Upload the shared dependency store
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turbo-store
          path: turbo-store.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  build:
    name: Build sqlite amd64 (${{ matrix.supplied && 'supplied' || 'from scratch' }})
    needs: prime
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both halves of the comparison, side by side in one run: one job takes the
        # primed dependencies and one deliberately does not.
        supplied: [true, false]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-zigbuild
          fallback: none

      - name: Download the shared dependency store
        if: matrix.supplied
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: turbo-store
          path: .artifacts/turbo

      - name: Unpack the shared dependency store
        if: matrix.supplied
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.cache"
          tar -C "${HOME}/.cache" --zstd -xf .artifacts/turbo/turbo-store.tar.zst

      - name: Install cargo-turbo
        if: matrix.supplied
        run: cargo install cargo-turbo --locked --version ${{ env.TURBO_VERSION }}

      - name: Supply prebuilt dependencies
        if: matrix.supplied
        working-directory: api
        run: cargo turbo prepare zigbuild --release --target "${RUST_TARGET}"

      - name: Build the real binary
        working-directory: api
        run: |
          set -euo pipefail
          start=$(date +%s)
          cargo zigbuild --release --locked \
            --target "${RUST_TARGET}" \
            --no-default-features --features db_sqlite \
            --bin sso_sqlite 2>&1 | tee /tmp/build.log
          echo "BUILD: took $(( $(date +%s) - start ))s"
          echo "BUILD: crates compiled: $(grep -c Compiling /tmp/build.log || true)"

      - name: Check the binary is real
        working-directory: api
        run: |
          test -x "target/${RUST_TARGET}/release/sso_sqlite"
          ls -l "target/${RUST_TARGET}/release/sso_sqlite"
          file "target/${RUST_TARGET}/release/sso_sqlite"
